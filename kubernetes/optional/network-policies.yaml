# Opt-in. Only enforced if the cluster CNI supports NetworkPolicy. The e-commerce services (which expose /faults/**
# on their normal port) accept traffic only from OpsMind components. There is no Ingress and every Service is ClusterIP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ecommerce-ingress-from-opsmind-only, namespace: opsmind }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [payment-service, inventory-service, order-service, product-catalog-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [opsmind-core, order-service, frontend, prometheus] }
