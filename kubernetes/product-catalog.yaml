apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-service
  namespace: opsmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog-service
  template:
    metadata:
      labels:
        app: product-catalog-service
    spec:
      containers:
        - name: product-catalog-service
          image: opsmind-product-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: CATALOG_DB_URL
              value: jdbc:postgresql://ecommerce-db:5432/catalog_db
            - name: CATALOG_DB_USER
              value: catalog
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: CATALOG_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog-service
  namespace: opsmind
spec:
  selector:
    app: product-catalog-service
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP