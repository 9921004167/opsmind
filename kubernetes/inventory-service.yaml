apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: opsmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: opsmind-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8092
          env:
            - name: SERVER_PORT
              value: "8092"
            - name: INVENTORY_DB_URL
              value: jdbc:postgresql://ecommerce-db:5432/inventory_db
            - name: INVENTORY_DB_USER
              value: inventory
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: INVENTORY_DB_PASSWORD
            - name: INVENTORY_REDIS_HOST
              value: redis
            - name: INVENTORY_REDIS_PORT
              value: "6379"
            - name: FAULT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: FAULT_ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: opsmind
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8092
      targetPort: 8092
  type: ClusterIP