
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-db
  namespace: opsmind
spec:
  clusterIP: None
  selector:
    app: ecommerce-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecommerce-db
  namespace: opsmind
spec:
  serviceName: ecommerce-db
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-db
  template:
    metadata:
      labels:
        app: ecommerce-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: ecommerce_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: ECOMMERCE_DB_ADMIN_PASSWORD
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: CATALOG_DB_PASSWORD
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: ORDER_DB_PASSWORD
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsmind-secrets
                  key: INVENTORY_DB_PASSWORD
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
          volumeMounts:
            - name: ecommerce-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/01-create-databases.sh
              subPath: 01-create-databases.sh
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: ecommerce-db-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: ecommerce-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
