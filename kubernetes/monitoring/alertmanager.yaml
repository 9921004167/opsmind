# The webhook token inside alertmanager.yml must equal OPSMIND_WEBHOOK_TOKEN in the opsmind-secrets secret.
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: opsmind }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{ containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9093 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: 9093 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/alertmanager }]
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: opsmind }
spec:
  type: ClusterIP
  selector: { app: alertmanager }
  ports: [{ port: 9093, targetPort: 9093 }]
