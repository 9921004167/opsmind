# OPT-IN Kafka Connect + Debezium change-data-capture for the Order Service's `orders` table.
# NOT loaded by a plain `docker compose up`. Use:
#   docker compose -f docker-compose.yml -f docker-compose.connect.yml up -d
# Effect: order-state changes (CREATED -> PAID/PAYMENT_FAILED -> CONFIRMED/INVENTORY_FAILED) are captured from the
# Postgres write-ahead log and published to the Kafka topic  ecom.public.orders  without touching the Order Service code.
services:
  ecommerce-db:
    # Debezium reads the WAL via logical decoding. Changing wal_level needs one restart of this container (data is kept).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]

  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      ecommerce-db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: opsmind-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # Single-broker cluster: internal topics must use replication factor 1.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
