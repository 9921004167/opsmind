server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unmatched path falls back to index.html so React
    # Router can handle client-side routes like /incidents/<uuid>.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Real reverse proxy to opsmind-core - the browser only ever talks to this
    # nginx origin, so there is no cross-origin request and no CORS
    # configuration needed anywhere in opsmind-core.
    location /api/ {
        proxy_pass http://opsmind-core:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Real health-check proxies to each e-commerce service, avoiding browser
    # CORS entirely (see src/api/health.js for why this exists).
    location /health-proxy/order/ {
        proxy_pass http://order-service:8093/actuator/health;
    }
    location /health-proxy/payment/ {
        proxy_pass http://payment-service:8091/actuator/health;
    }
    location /health-proxy/inventory/ {
        proxy_pass http://inventory-service:8092/actuator/health;
    }
    location /health-proxy/catalog/ {
        proxy_pass http://product-catalog-service:8090/actuator/health;
    }
}
