groups:
  - name: opsmind-ecommerce-alerts
    rules:

      # Section 7 example: "Payment Service: 5xx rate > 10% for 2 consecutive
      # minutes" - generalized here across every scraped service via label_replace,
      # so the same rule covers payment/order/inventory/catalog without duplication.
      # NOTE: organization/project/environment labels below are HARDCODED to match
      # whatever you registered in OpsMind via the API (see README "Phase 4"). If
      # you registered different slugs, these labels must match or the webhook
      # will reject the alert as "unknown organization/project/environment".
      - alert: ServiceHigh5xxRate
        expr: >
          label_replace(
            (
              sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
              /
              sum by (job) (rate(http_server_requests_seconds_count[1m]))
            ) > 0.1,
            "service", "$1", "job", "(.*)"
          )
        for: 10s
        labels:
          severity: HIGH
          organization: test-org
          project: ecommerce-platform
          environment: PRODUCTION
          alert_type: high_error_rate
        annotations:
          summary: "{{ $labels.job }} elevated 5xx error rate"
          description: "{{ $labels.job }} 5xx rate is {{ $value | humanizePercentage }} over the last 1m (threshold 10%)"

      - alert: ServiceDown
        expr: >
          label_replace(
            up{job=~"payment-service|order-service|inventory-service|product-catalog-service"} == 0,
            "service", "$1", "job", "(.*)"
          )
        for: 10s
        labels:
          severity: CRITICAL
          organization: test-org
          project: ecommerce-platform
          environment: PRODUCTION
          alert_type: service_down
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} for at least 10s"

      - alert: ServiceHighLatency
        expr: >
          label_replace(
            histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket[1m]))) > 1,
            "service", "$1", "job", "(.*)"
          )
        for: 10s
        labels:
          severity: MEDIUM
          organization: test-org
          project: ecommerce-platform
          environment: PRODUCTION
          alert_type: high_latency
        annotations:
          summary: "{{ $labels.job }} p95 latency above 1s"
          description: "{{ $labels.job }} p95 request latency is {{ $value | humanizeDuration }} over the last 1m"